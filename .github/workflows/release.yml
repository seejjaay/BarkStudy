# Releases. release-please keeps a release PR open on main, with the version bump and CHANGELOG.md worked out from the
# conventional commits. Merging that PR creates the vX.Y.Z tag and release, and the publish job below builds the installer
# and attaches it. Every third-party action is pinned to a full commit SHA (the version is in the comment); Dependabot bumps
# them weekly. See docs/release.md for what a maintainer does and the secrets this uses.
name: Release
on:
  push:
    branches: [main]

# Nothing by default: each job asks for exactly what it needs.
permissions: {}

# Two pushes to main in a row queue up instead of racing for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      # Signing runs only once the SignPath project exists: the token is a secret, the rest are repository variables.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Nothing is uploaded unless the same checks as CI pass on exactly this tag.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: node scripts/verify-package.cjs

      # ---- Signing (off until SignPath approves the project; see docs/release.md "First signed release") -------------
      # Order matters. The installer carries the signed exe, then is signed itself, and latest.yml is rewritten last because
      # electron-updater refuses a download whose sha512 differs from the one in latest.yml.
      - name: Upload the exe for signing
        if: env.SIGN == 'true'
        id: exe-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-unsigned
          path: release/win-unpacked/BarkStudy.exe
      - name: Sign the exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.exe-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/exe
      - name: Rebuild the installer around the signed exe
        if: env.SIGN == 'true'
        run: |
          cp signed/exe/BarkStudy.exe release/win-unpacked/BarkStudy.exe
          rm -f release/BarkStudy-Setup-*.exe release/BarkStudy-Setup-*.blockmap release/latest.yml
          npx electron-builder --win --prepackaged release/win-unpacked --publish never
      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: installer-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: release/BarkStudy-Setup-*.exe
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/installer
      - name: Put the signed installer in place and fix latest.yml
        if: env.SIGN == 'true'
        run: |
          cp signed/installer/BarkStudy-Setup-*.exe release/
          # The blockmap no longer matches the signed bytes, so updates download in full.
          rm -f release/BarkStudy-Setup-*.blockmap
          node scripts/update-latest-yml.cjs release/latest.yml release/BarkStudy-Setup-*.exe

      # ---- Upload ---------------------------------------------------------------------------------------------------
      - name: latest.yml must match the installer that is about to go up
        run: node scripts/update-latest-yml.cjs --check release/latest.yml release/BarkStudy-Setup-*.exe
      - name: Attach the installer, its blockmap (if any) and latest.yml to the release
        run: |
          files=(release/BarkStudy-Setup-*.exe release/latest.yml)
          for f in release/BarkStudy-Setup-*.blockmap; do [ -e "$f" ] && files+=("$f"); done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Say so on the release when it is not signed
        if: env.SIGN != 'true'
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            printf '%s\n\n' '> **Unsigned beta.** Windows SmartScreen will warn about this installer. Choose **More info**, then **Run anyway**. Signed builds come once the code-signing application is approved.'
            cat notes.md
          } > notes-new.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes-new.md

  # winget: only for a stable release at 1.0 or later, and only once WINGET_TOKEN exists. The first submission of the package
  # is made by hand (wingetcreate new); this job then files the update PR for every later release. See docs/release.md.
  winget:
    needs: [release-please, publish]
    runs-on: windows-latest
    permissions: {}
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      HAVE_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Stable and 1.0 or later?
        id: gate
        shell: bash
        run: |
          # "v1.2.3" qualifies; "v0.9.0" (too early) and "v1.2.3-beta.1" (a prerelease) do not.
          if [[ "$TAG" =~ ^v([1-9][0-9]*)\.[0-9]+\.[0-9]+$ ]] && [ "$HAVE_TOKEN" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not submitting $TAG to winget (needs a stable tag at 1.0 or later and the WINGET_TOKEN secret)."
          fi
      - name: Submit the update to winget-pkgs
        if: steps.gate.outputs.go == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: seejjaay.BarkStudy
          installers-regex: 'BarkStudy-Setup-.*\.exe$'
          release-tag: ${{ env.TAG }}
          token: ${{ secrets.WINGET_TOKEN }}
