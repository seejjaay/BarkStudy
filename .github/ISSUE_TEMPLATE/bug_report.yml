name: Bug report
description: Something in BarkStudy did not work, or Pandesal misbehaved.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. If this is a security problem, please **do not** file it here: use [private reporting](https://github.com/seejjaay/BarkStudy/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What were you doing, which app was in front, was a session running?
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In BarkStudy, open **About**, choose **Copy diagnostics**, check the preview, and paste it here. It has the version, Windows and display details, recent errors and the engine's event log, with your paths and user name removed and no card text.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the About page.
